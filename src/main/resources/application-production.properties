server.port=${PORT:8080}

# Identificacion del ambiente
app.environment.name=Entorno de Producción
app.environment.url=https://api.viajes-farsheen.com

# Conexion a base de datos MySQL en Produccion (configurable por variables de entorno con fallback local XAMPP 3307)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:viajes_farsheen_prod}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion del pool de conexiones para la BD (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Ocultar stacktraces en errores por seguridad
server.error.include-stacktrace=never
server.error.include-message=never

# Logs en Produccion
logging.level.root=WARN
logging.level.com.eam.viajes_farsheen=INFO

# Documentacion Swagger / OpenAPI habilitada
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
