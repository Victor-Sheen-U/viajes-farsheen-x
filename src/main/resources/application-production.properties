server.port=${PORT:8080}

# Conexion a base de datos MySQL en Produccion (requiere variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:viajes_farsheen_prod}?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# configuracion del pool de conexiones para la db (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Configuracion JPA / Hibernate (usando validate para proteger la integridad del proyecto)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Ocultar los stacktraces en errores por si acaso es mas seguro
server.error.include-stacktrace=never
server.error.include-message=never

# los logs en Produccion
logging.level.root=WARN
logging.level.com.eam.viajes_farsheen=INFO

# Documentacion Swagger / OpenAPI (apagada por seguridad en produccion)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
