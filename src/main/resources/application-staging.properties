server.port=${PORT:8080}

# Identificacion del ambiente
app.environment.name=Entorno de Staging
app.environment.url=https://staging.api.viajes-farsheen.com

# Conexion a base de datos MySQL de Staging (configurable por variables de entorno con fallback local XAMPP 3307)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:viajes_farsheen_staging}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion JPA / Hibernate para Staging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# Logs en Staging
logging.level.root=INFO
logging.level.com.eam.viajes_farsheen=INFO

# Swagger / OpenAPI habilitado para validaciones y pruebas QA
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
