server.port=${PORT:8080}

# Conexion a base de datos MySQL de Staging (configurable por las variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:viajes_farsheen_staging}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:staging_user}
spring.datasource.password=${DB_PASSWORD:staging_password}

# Configuracion JPA / Hibernate para el Staging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# los logs en el Staging
logging.level.root=INFO
logging.level.com.eam.viajes_farsheen=INFO

# Swagger / OpenAPI habilitado para las validaciones que hace el QA
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
