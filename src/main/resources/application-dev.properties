
server.port=8080

# Conexion a base de datos MySQL / MariaDB local (XAMPP por defecto puerto 3307)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:viajes-farsheen}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# por si acaso para pruebas locales con h2 si xampp esta apagado (delfinDb)
# spring.datasource.url=jdbc:h2:mem:viajesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Configuracion JPA y Hibernate para lo de desarrollo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs del estado de desarrollo
logging.level.root=INFO
logging.level.com.eam.viajes_farsheen=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# la documentacion de Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
