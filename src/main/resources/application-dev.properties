server.port=${PORT:8080}

# Identificacion del ambiente
app.environment.name=Entorno de Desarrollo
app.environment.url=https://dev.api.viajes-farsheen.com

# Conexion a base de datos MySQL / MariaDB local (XAMPP por defecto puerto 3307)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:viajes-farsheen}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion JPA y Hibernate para desarrollo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs en desarrollo
logging.level.root=INFO
logging.level.com.eam.viajes_farsheen=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Documentacion Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
